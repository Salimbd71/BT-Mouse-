name: Build & Release APK & Windows EXE

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (current: 1.0)"
        required: true
        type: string
        default: "1.0"
      run_unit_tests:
        description: "Run unit tests"
        required: false
        type: boolean
        default: true
      build_release_apk:
        description: "Build Release APK"
        required: false
        type: boolean
        default: true
      build_debug_apk:
        description: "Build Debug APK"
        required: false
        type: boolean
        default: false
      build_setup_exe:
        description: "Build Windows Setup Installer (BTMouseReceiver-Setup.exe)"
        required: false
        type: boolean
        default: true
      build_portable_exe:
        description: "Build Windows Portable Executable (BTMouseReceiver.exe)"
        required: false
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android & Run Tests
    if: ${{ inputs.run_unit_tests || inputs.build_release_apk || inputs.build_debug_apk }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version properties
        shell: bash
        run: |
          set -euo pipefail
          RAW_VER="${{ inputs.app_version }}"
          VERSION_NAME="${RAW_VER#v}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "${VERSION_NAME//[^0-9.]/}"
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          if [ "$VERSION_NAME" = "1.0" ]; then
            VERSION_CODE=1
          else
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE="${{ github.run_number }}"
          fi
          RECEIVER_URL="${{ github.server_url }}/${{ github.repository }}/releases/latest/download/BTMouseReceiver-Setup.exe"
          APK_URL="${{ github.server_url }}/${{ github.repository }}/releases/latest/download/BT-mouse-release.apk"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "WINDOWS_RECEIVER_URL=$RECEIVER_URL" >> "$GITHUB_ENV"
          echo "ANDROID_APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "Resolved Android version: $VERSION_NAME (versionCode=$VERSION_CODE)"
          echo "Resolved Receiver URL: $RECEIVER_URL"
          echo "Resolved APK URL: $APK_URL"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ] || [ ! -w "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" \
            /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        if: ${{ inputs.run_unit_tests || inputs.build_debug_apk }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare release keystore
        if: ${{ inputs.build_release_apk }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "Using repository release signing secrets."
          else
            rm -f my-upload-key.jks
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=BT WiFi Mouse, OU=Mobile, O=SLM, L=Naogaon, S=Rajshahi, C=BD"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "Signing secrets not set; using temporary release keystore."
          fi

      - name: Run unit tests
        if: ${{ inputs.run_unit_tests }}
        run: gradle :app:testDebugUnitTest --no-daemon -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" -PwindowsReceiverUrl="$WINDOWS_RECEIVER_URL" -PandroidApkUrl="$ANDROID_APK_URL"

      - name: Build Debug APK
        if: ${{ inputs.build_debug_apk }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" -PwindowsReceiverUrl="$WINDOWS_RECEIVER_URL" -PandroidApkUrl="$ANDROID_APK_URL"

      - name: Build Release APK
        if: ${{ inputs.build_release_apk }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" -PwindowsReceiverUrl="$WINDOWS_RECEIVER_URL" -PandroidApkUrl="$ANDROID_APK_URL"

      - name: Upload Debug APK artifact
        if: ${{ inputs.build_debug_apk }}
        uses: actions/upload-artifact@v6
        with:
          name: bt-mouse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK artifact
        if: ${{ inputs.build_release_apk }}
        uses: actions/upload-artifact@v6
        with:
          name: bt-mouse-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows Receiver (.exe)
    if: ${{ inputs.build_setup_exe || inputs.build_portable_exe }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained BTMouseReceiver.exe
        shell: pwsh
        run: |
          $rawVer = "${{ inputs.app_version }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($rawVer)) { $rawVer = "1.0" }
          $numVer = ($rawVer -replace '[^0-9.]', '')
          if ([string]::IsNullOrWhiteSpace($numVer)) { $numVer = "1.0" }
          dotnet publish windows-receiver/BTMouseReceiver.csproj `
            -c Release `
            -r win-x64 `
            -p:Version=$numVer `
            -o windows-receiver/publish

      - name: Build BTMouseReceiver-Setup.exe with Inno Setup
        if: ${{ inputs.build_setup_exe }}
        shell: pwsh
        run: |
          $rawVer = "${{ inputs.app_version }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($rawVer)) { $rawVer = "1.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          & $iscc "/DMyAppVersion=$rawVer" windows-receiver\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Setup Installer (.exe)
        if: ${{ inputs.build_setup_exe }}
        uses: actions/upload-artifact@v6
        with:
          name: bt-mouse-windows-setup-exe
          path: windows-receiver/installer-out/BTMouseReceiver-Setup.exe
          if-no-files-found: error

      - name: Upload Windows Portable Executable (.exe)
        if: ${{ inputs.build_portable_exe }}
        uses: actions/upload-artifact@v6
        with:
          name: bt-mouse-windows-portable-exe
          path: windows-receiver/publish/BTMouseReceiver.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows-exe]
    if: ${{ always() && (inputs.build_release_apk || inputs.build_debug_apk || inputs.build_setup_exe || inputs.build_portable_exe) && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') && (needs.build-windows-exe.result == 'success' || needs.build-windows-exe.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Release APK
        if: ${{ inputs.build_release_apk }}
        uses: actions/download-artifact@v8
        with:
          name: bt-mouse-release-apk
          path: dist/apk-release

      - name: Download Debug APK
        if: ${{ inputs.build_debug_apk }}
        uses: actions/download-artifact@v8
        with:
          name: bt-mouse-debug-apk
          path: dist/apk-debug

      - name: Download Windows Setup Installer
        if: ${{ inputs.build_setup_exe }}
        uses: actions/download-artifact@v8
        with:
          name: bt-mouse-windows-setup-exe
          path: dist/win-setup

      - name: Download Windows Portable EXE
        if: ${{ inputs.build_portable_exe }}
        uses: actions/download-artifact@v8
        with:
          name: bt-mouse-windows-portable-exe
          path: dist/win-portable

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_VER="${{ inputs.app_version }}"
          VERSION_NAME="${RAW_VER#v}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          TAG="v${VERSION_NAME}"

          mkdir -p release-assets

          if [ -d dist/apk-release ]; then
            RELEASE_APK=$(find dist/apk-release -name "*.apk" | head -n 1 || true)
            if [ -n "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" "release-assets/BT-mouse-release.apk"
            fi
          fi

          if [ -d dist/apk-debug ]; then
            DEBUG_APK=$(find dist/apk-debug -name "*.apk" | head -n 1 || true)
            if [ -n "$DEBUG_APK" ]; then
              cp "$DEBUG_APK" "release-assets/BT-mouse-v${VERSION_NAME}-debug.apk"
            fi
          fi

          if [ -d dist/win-setup ] && [ -f dist/win-setup/BTMouseReceiver-Setup.exe ]; then
            cp dist/win-setup/BTMouseReceiver-Setup.exe "release-assets/BTMouseReceiver-Setup.exe"
          fi

          if [ -d dist/win-portable ] && [ -f dist/win-portable/BTMouseReceiver.exe ]; then
            cp dist/win-portable/BTMouseReceiver.exe "release-assets/BTMouseReceiver-v${VERSION_NAME}.exe"
          fi

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No release assets selected."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "BT/WiFi Mouse With File Transfer $TAG" \
              --notes "BT/WiFi Mouse With File Transfer $TAG release"
          fi
